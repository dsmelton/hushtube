# HushTube edge cache: tailscale serve (:443) -> this nginx (127.0.0.1:3000) -> Invidious (127.0.0.1:3002)
#
# Why: Invidious re-fetches every thumbnail, avatar, channel and trending list from YouTube on each
# request (no server-side cache; thumbnails carry max-age=300). This layer caches the public,
# user-independent responses and serves them stale while it refreshes in the background, so a
# repeat view never waits on YouTube. Everything else (watch pages, video bytes, auth, POSTs)
# streams straight through, unbuffered.
#
# Cached:  /vi /ggpht /sb (images)                 2 d fresh, served stale while refreshing
#          /api/v1/channels/<id>                    1 d   (avatars)
#          /api/v1/channels/<id>/<tab>              15 min
#          /api/v1/trending, /api/v1/search*        10-30 min
#          /api/v1/videos/<id>?ivxc=1               1 h   (ivx.js reads only; plain requests bypass,
#                                                          so the next-video warm still warms Invidious)
#          GET /feed/trending, /search (HTML)        5-10 min, keyed per Cookie (login/prefs-aware)
# Never cached: /watch, /channel pages, /feed/subscriptions|history, /api/v1/auth/*, anything with Set-Cookie.
# Debug: response header X-Cache (HIT/MISS/STALE/UPDATING/BYPASS); bypass Invidious directly on :3002.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    sendfile on;
    tcp_nodelay on;
    server_tokens off;
    client_max_body_size 64m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml application/xml;

    proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:32m max_size=4g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:16m max_size=512m inactive=7d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/page levels=1:2 keys_zone=page:8m max_size=256m inactive=2d use_temp_path=off;

    upstream invidious {
        server 127.0.0.1:3002;
        keepalive 32;
    }

    # /api/v1/videos is cached only when ivx.js opts in with ?ivxc=1
    map $arg_ivxc $vid_nocache { "" 1; default 0; }
    # HTML caching only for plain GETs
    map $request_method $page_nocache { GET 0; HEAD 0; default 1; }

    server {
        listen 127.0.0.1:3000;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Cache $upstream_cache_status always;

        # ---- default: stream everything through untouched (watch pages, video bytes, auth, POSTs)
        location / {
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass http://invidious;
        }

        # ---- images: thumbnails, avatars/banners, storyboards
        location ~ ^/(vi|ggpht|sb)/ {
            proxy_pass http://invidious;
            proxy_cache img;
            proxy_cache_key $request_uri;
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Set-Cookie;
            proxy_cache_valid 200 2d;
            proxy_cache_valid 404 1h;
            proxy_cache_valid any 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 8s;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
            add_header X-Cache $upstream_cache_status always;
        }

        # ---- public JSON (user-independent): one shared copy, cookies stripped
        location ~ ^/api/v1/channels/[A-Za-z0-9_-]+$ {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_valid 200 1d;
        }
        location ~ ^/api/v1/channels/[A-Za-z0-9_-]+/(videos|shorts|streams|playlists|latest|podcasts|releases)$ {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_valid 200 15m;
        }
        location = /api/v1/trending {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_valid 200 10m;
        }
        location = /api/v1/search {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_valid 200 30m;
        }
        location = /api/v1/search/suggestions {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_valid 200 1d;
        }
        location ~ "^/api/v1/videos/[A-Za-z0-9_-]{11}$" {
            proxy_pass http://invidious;
            proxy_cache api;
            include /etc/nginx/ivx-api.conf;
            proxy_cache_bypass $vid_nocache;
            proxy_no_cache $vid_nocache;
            proxy_cache_valid 200 1h;
        }

        # ---- HTML: home (trending) + search results, keyed per Cookie so login state / prefs stay correct
        location ~ ^/(feed/trending|search)$ {
            proxy_pass http://invidious;
            proxy_cache page;
            proxy_cache_key "$request_uri|$http_cookie";
            proxy_cache_bypass $page_nocache;
            proxy_no_cache $page_nocache;
            proxy_set_header Accept-Encoding "";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 8s;
            add_header Cache-Control "private, no-cache" always;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
