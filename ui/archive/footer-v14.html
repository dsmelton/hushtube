<style>
/* ================= Hermes UI v2 — "shell" redesign =================
   One persistent navigation for every client (desktop sidebar / tablet rail /
   phone bottom bar) rendered from this footer, plus a calmer YouTube-like
   content layer. Pure CSS + static HTML: works in the PWA, desktop browsers
   and the APK alike (page CSP blocks inline JS, so nothing here needs it).
   Page detection uses body:has(<element unique to that page>).            */

:root{
  --ivx-bg:#0f0f0f; --ivx-s1:#181818; --ivx-s2:#222; --ivx-s3:#2e2e2e;
  --ivx-line:rgba(255,255,255,.1); --ivx-tx:#f1f1f1; --ivx-mu:#aaa; --ivx-dim:#777;
  --ivx-ac:#f2433a; --ivx-link:#6cb6ff;
  --ivx-top:56px; --ivx-side:240px; --ivx-pad:24px;
  --ivx-font:"Roboto","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* ---------- base ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,body.dark-theme{background:var(--ivx-bg)!important;color:var(--ivx-tx);font-family:var(--ivx-font)}
/* not on video.js buttons: their icons ARE font glyphs (VideoJS font) set on the button itself */
.pure-g,.pure-g [class*=pure-u],button:not(.vjs-button):not(.vjs-menu-button),input,select,textarea,.pure-button{font-family:var(--ivx-font)!important}
body{padding:calc(var(--ivx-top) + var(--iv-sb,0px)) var(--iv-r,0px) var(--ivx-mini,0px) calc(var(--ivx-side) + var(--iv-l,0px))!important;
  box-sizing:border-box;margin:0}
body>.pure-g{display:block}
#contents{width:auto!important;max-width:none;margin:0!important;padding:0 var(--ivx-pad)!important;
  box-sizing:border-box;min-height:calc(100vh - var(--ivx-top))}
.h-box{padding-left:0!important;padding-right:0!important}
a{color:var(--ivx-tx);text-decoration:none}
a:hover{color:#fff}
.pure-menu-heading{text-transform:none!important;letter-spacing:normal}
::selection{background:var(--ivx-ac);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3d3d3d;border-radius:8px;border:2px solid var(--ivx-bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ivx-ac);outline-offset:2px}
button,.pure-button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
hr{border:0;border-top:1px solid var(--ivx-line);margin:16px 0}
#contents>.h-box:has(>hr:only-child){display:none}
.pure-button{border-radius:999px!important;font-family:inherit;font-weight:500;padding:.55em 1.2em}
.pure-button-primary,.pure-button-primary:hover,.pure-button-primary:focus{
  background:var(--ivx-ac)!important;border-color:var(--ivx-ac)!important;color:#fff!important}
.pure-button-secondary{background:var(--ivx-s2)!important;color:var(--ivx-tx)!important;border:0!important}
.pure-button-secondary:hover{background:var(--ivx-s3)!important}
select,input[type=text],input[type=number],input[type=password],input[type=email],textarea{
  background:var(--ivx-s1)!important;color:var(--ivx-tx)!important;border:1px solid var(--ivx-line)!important;
  border-radius:10px!important;box-shadow:none!important;font-family:inherit}
/* upstream footer links + old APK tab bar are replaced by #ivx-nav */
footer{margin:48px 0 0;padding:0;font-size:12px;opacity:1}
footer>.pure-g{display:none!important}
#footer-info{padding:0!important}
#hermes-tabnav,.ivx-more{display:none!important}
#watch-on-another-invidious-instance,#embed-link,#annotations,#genre,#license,#family_friendly,
#allowed_regions,#link-yt-embed,.icon-buttons a[href*="redirect"]{display:none!important}
#watch-on-youtube{font-size:0}
#watch-on-youtube a#link-yt-watch{font-size:13px}

/* ---------- top bar ---------- */
.navbar{position:fixed!important;top:0;left:0;right:0;z-index:1000;margin:0!important;box-sizing:border-box;
  height:calc(var(--ivx-top) + var(--iv-sb,0px));
  padding:var(--iv-sb,0px) calc(16px + var(--iv-r,0px)) 0 calc(16px + var(--iv-l,0px))!important;
  display:grid!important;grid-template-columns:minmax(max-content,1fr) minmax(0,640px) minmax(max-content,1fr);gap:16px;align-items:center;align-content:center;
  background:rgba(15,15,15,.94);border-bottom:1px solid transparent;
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.navbar>div{width:auto!important;margin:0!important;padding:0!important;flex:none!important;min-width:0}
.navbar>div:first-child{justify-self:start}
.index-link{position:relative;display:inline-flex!important;align-items:center;gap:9px;padding:6px 4px!important;
  font-size:19px!important;font-weight:700!important;letter-spacing:-.035em!important;color:#fff!important;white-space:nowrap}
.index-link::before{content:"";flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ivx-ac)}
.index-link::after{content:"";position:absolute;left:14px;top:50%;margin-top:-6px;
  border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.searchbar{width:100%}
.searchbar>form.pure-form{display:flex!important;align-items:center;width:100%!important;margin:0!important;height:40px;
  box-sizing:border-box;background:#121212;border:1px solid #303030;border-radius:999px;padding:0 0 0 18px;overflow:hidden}
.searchbar>form.pure-form:focus-within{border-color:#1c62b9;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.searchbar fieldset{flex:1 1 0;min-width:0;padding:0;margin:0;border:0}
.searchbar input[type=search]{width:100%;margin:0!important;padding:0!important;border:0!important;background:transparent!important;
  color:var(--ivx-tx)!important;font:400 16px var(--ivx-font);box-shadow:none!important;outline:none;-webkit-appearance:none;appearance:none}
.searchbar input[type=search]::placeholder{color:#888}
.searchbar #searchbutton{flex:0 0 auto;align-self:stretch;width:62px;border:0;border-left:1px solid #303030;
  background:var(--ivx-s2);color:var(--ivx-tx);font-size:19px;cursor:pointer;padding:0;margin:0}
.searchbar #searchbutton:hover{background:var(--ivx-s3)}
.user-field{justify-self:end;display:flex!important;align-items:center;gap:6px}
.user-field>div{width:auto!important;display:block}
.user-field>div:has(#toggle_theme),.user-field>div:has(a[href^="/preferences"]),
.user-field>div:has(a[href^="/login"]),.user-field>div:has(#user_name){display:none!important}
#notification_ticker{display:flex!important;align-items:center;justify-content:center;gap:2px;height:40px;min-width:40px;
  border-radius:999px;font-size:22px;padding:0 8px!important}
#notification_ticker:hover{background:var(--ivx-s2)}
#notification_count{font-size:12px;font-weight:700;background:var(--ivx-ac);color:#fff;border-radius:999px;padding:1px 6px}
.user-field form a.pure-menu-heading{display:inline-flex;align-items:center;height:36px;padding:0 14px!important;
  border:1px solid var(--ivx-line);border-radius:999px;font-size:14px;color:var(--ivx-tx)}
.user-field form a.pure-menu-heading:hover{background:var(--ivx-s2)}
.user-field form input[type=submit]{cursor:pointer}

/* ---------- navigation (#ivx-nav, markup below) ---------- */
#ivx-nav{position:fixed;z-index:990;left:var(--iv-l,0px);top:calc(var(--ivx-top) + var(--iv-sb,0px));bottom:0;
  width:var(--ivx-side);box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;
  padding:12px 12px 20px;background:var(--ivx-bg);font:400 14px var(--ivx-font);text-align:left;scrollbar-width:none}
#ivx-nav::-webkit-scrollbar{display:none}
.ivx-sec{display:block;padding:0 0 12px;margin:0 0 12px;border-bottom:1px solid var(--ivx-line)}
.ivx-h{display:block;padding:6px 12px 6px;font-size:16px;font-weight:600;color:var(--ivx-tx)}
#ivx-nav a.ivx-i{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:10px;
  color:var(--ivx-tx)!important;white-space:nowrap}
#ivx-nav a.ivx-i:hover{background:var(--ivx-s2)}
#ivx-nav a.ivx-i i{width:24px;font-size:22px;text-align:center;line-height:1}
#ivx-nav a.ivx-i i.ion-logo-game-controller-b{font-size:20px}
.ivx-blurb{margin:2px 12px 10px;color:var(--ivx-mu);font-size:13.5px;line-height:1.45}
#ivx-nav a.ivx-signin{display:inline-flex;height:36px;margin:0 12px;padding:0 14px;gap:8px;
  border:1px solid var(--ivx-line);color:var(--ivx-link)!important;font-weight:500}
#ivx-nav a.ivx-signin:hover{background:rgba(108,182,255,.12)}
#ivx-nav a.ivx-signin i{width:auto;font-size:20px}
.ivx-about{display:block;padding:4px 12px;color:var(--ivx-dim);font-size:12px;line-height:1.6}
.ivx-about a{color:var(--ivx-dim)!important}
.ivx-about a:hover{color:var(--ivx-tx)!important}
/* logged-in vs anonymous (only logged-in pages render #notification_ticker) */
body:not(:has(#notification_ticker)) .ivx-auth,body:has(#notification_ticker) .ivx-anon{display:none!important}
/* active item */
body:has(#contents>.feed-menu+.pure-g a[href*="type=Livestreams"]):has(#contents>.feed-menu+.pure-g a[href*="type=Gaming"]) .ivx-home,
body:has(#contents>.feed-menu+.pure-g b):has(#contents>.feed-menu+.pure-g a[href*="type=Gaming"]) .ivx-live,
body:has(#contents>.feed-menu+.pure-g b):has(#contents>.feed-menu+.pure-g a[href*="type=Livestreams"]) .ivx-gaming,
body:has(#contents>.pure-g.h-box a[href="/subscription_manager"]) .ivx-subs,
body:has(#contents>.pure-g.h-box a[href^="/create_playlist"]) .ivx-pl,
body:has(#contents>.pure-g.h-box a[href="/clear_watch_history"]) .ivx-hist,
body:has(#contents form[action^="/preferences"]) .ivx-set,
body:has(#contents form[action^="/login"]) .ivx-signin{background:var(--ivx-s3)!important;font-weight:600}

/* ---------- page headers ---------- */
.feed-menu{display:none!important}
.ivx-title,#contents>.feed-menu+.pure-g.h-box::before,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"])::before,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"])::before{
  flex:0 0 100%;order:-1;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
#contents>.feed-menu+.pure-g.h-box,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"]),
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"]){
  display:flex!important;flex-wrap:wrap;align-items:center;gap:8px;padding:20px 0 8px!important;letter-spacing:normal}
#contents>.feed-menu+.pure-g.h-box::before{content:"Trending"}
#contents>.feed-menu+.pure-g.h-box:has(b):has(a[href*="type=Gaming"])::before{content:"Live now"}
#contents>.feed-menu+.pure-g.h-box:has(b):has(a[href*="type=Livestreams"])::before{content:"Gaming"}
#contents>.feed-menu+.pure-g.h-box:has(a[href="/subscription_manager"])::before{content:"Subscriptions"}
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"])::before{content:"History"}
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"])::before{content:"Playlists"}
#contents>.feed-menu+.pure-g.h-box>div,#contents>.feed-menu+.pure-g.h-box>div>.pure-g,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"])>div,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"])>div{display:contents!important}
#contents>.feed-menu+.pure-g.h-box>.pure-u-2-3:not(:has(a)){display:none!important}
#contents>.feed-menu+.pure-g.h-box .pure-u-1{display:contents!important}
/* chips */
#contents>.feed-menu+.pure-g.h-box a,#contents>.feed-menu+.pure-g.h-box b,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"]) h3,
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"]) h3{
  display:inline-flex;align-items:center;gap:6px;height:32px;margin:0;padding:0 14px;border-radius:9px;
  background:var(--ivx-s2);color:var(--ivx-tx);font-size:14px;font-weight:500;white-space:nowrap}
#contents>.feed-menu+.pure-g.h-box a:hover{background:var(--ivx-s3)}
#contents>.feed-menu+.pure-g.h-box b{background:var(--ivx-tx);color:#0f0f0f}
#contents h3 a{color:inherit}
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href="/clear_watch_history"]) h3:not(:has(a)),
#contents>.pure-g.h-box:has(>.pure-u-1-3 a[href^="/create_playlist"]) h3:not(:has(a)){background:none;color:var(--ivx-mu);padding-left:2px}
#contents>.pure-g.h-box a[href="/clear_watch_history"]{color:#ff8a80}
#contents>.feed-menu+.pure-g.h-box h3{display:contents}
#contents>.feed-menu+.pure-g.h-box h3 a{display:inline-flex}
#contents:not(:has(.pure-u-md-1-4))>.feed-menu+.pure-g.h-box:has(a[href="/subscription_manager"])::after{
  content:"Nothing here yet. Open a channel and hit Subscribe \2014  new uploads will show up here.";
  flex:0 0 100%;order:9;margin:40px 0 0;padding:32px 20px;border:1px dashed var(--ivx-line);border-radius:14px;
  text-align:center;color:var(--ivx-mu);font-size:14px}
#contents:not(:has(.pure-u-md-1-4))>.feed-menu~center{display:none}
#contents>.feed-menu~center{display:block;color:var(--ivx-mu);font-size:13px;text-align:left;margin:4px 0}

/* ---------- video grid (feeds, search, channel, playlists) ---------- */
#contents .pure-g:has(>.pure-u-md-1-4){display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:32px 16px;margin:16px 0 8px!important;letter-spacing:normal}
#contents .pure-g>.pure-u-md-1-4{width:auto!important;min-width:0}
.pure-u-md-1-4>.h-box{padding:0!important;margin:0;background:none;animation:ivxIn .3s ease both}
/* history tiles: upstream renders an empty <p> (no title) — shimmer while ivx.js hydrates, then title+meta */
.pure-u-md-1-4 .h-box>p{margin:10px 2px 2px;font-size:15px;font-weight:600;line-height:1.35;color:var(--ivx-tx);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pure-u-md-1-4 .h-box>p a{color:inherit;text-decoration:none}
.pure-u-md-1-4 .h-box>p:empty::after{content:"";display:block;height:14px;margin:10px 2px 0;border-radius:4px;
  background:var(--ivx-s2);animation:ivxPulse 1.1s ease-in-out infinite}
.ivx-hist-meta{margin:2px;color:var(--ivx-mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ivxPulse{0%,100%{opacity:.45}50%{opacity:1}}
/* For You home feed */
#ivx-foryou{margin:18px 0 0;font-size:20px;font-weight:700;color:var(--ivx-tx)}
.ivx-skel .thumbnail{animation:ivxPulse 1.1s ease-in-out infinite}
.ivx-skel-line{height:14px!important;margin:10px 2px 0!important;border-radius:4px;background:var(--ivx-s2);
  animation:ivxPulse 1.1s ease-in-out infinite;display:block!important}
.ivx-scroll-sentinel{height:12px;margin:14px 2px 26px;border-radius:6px;background:var(--ivx-s2);
  animation:ivxPulse 1.1s ease-in-out infinite}
.ivx-scroll-end{color:var(--ivx-dim);font-size:13px;text-align:center;padding:14px 0 26px}
@keyframes ivxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
div.thumbnail{position:relative;border-radius:12px;overflow:hidden;background:var(--ivx-s1);aspect-ratio:16/9;margin:0}
div.thumbnail>a{display:block;width:100%;height:100%}
img.thumbnail{display:block;width:100%;height:100%;object-fit:cover;border-radius:0!important;transition:transform .35s ease}
.pure-u-md-1-4 .h-box:hover img.thumbnail{transform:scale(1.035)}
.bottom-right-overlay{position:absolute;right:8px;bottom:8px;margin:0;z-index:2!important}
.bottom-right-overlay .length{margin:0;background:rgba(0,0,0,.82)!important;color:#fff;padding:2px 6px;border-radius:5px;
  font-size:12px;font-weight:600;letter-spacing:.02em}
.bottom-right-overlay .length:has(.ion-ios-play-circle){background:#cc0000!important}
.watched-overlay{background:rgba(0,0,0,.45)!important}
.watched-indicator{background:var(--ivx-ac)!important;height:4px!important}
.top-left-overlay{position:absolute;left:8px;top:8px}
.top-left-overlay .low-profile{padding:4px 8px!important;background:rgba(0,0,0,.7)!important;color:#fff!important}
.pure-u-md-1-4 .video-card-row{margin:0;padding:0}
.pure-u-md-1-4 .video-card-row>a>p{margin:12px 0 4px;font-size:15.5px;font-weight:600;line-height:1.38;color:var(--ivx-tx);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pure-u-md-1-4 .video-card-row.flexible{display:flex;align-items:center;gap:6px}
.pure-u-md-1-4 .flex-left{flex:1 1 auto;min-width:0}
.channel-name{margin:0;font-size:13.5px;color:var(--ivx-mu)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a:hover .channel-name{color:var(--ivx-tx)!important}
.channel-name .icon,#channel-name .icon{font-size:.9em;color:var(--ivx-mu)}
.video-data{margin:1px 0 0;font-size:13.5px;font-weight:400!important;color:var(--ivx-mu)!important}
/* trending data from YouTube carries no view counts (always 0) — hide them there */
body:has(#contents>.feed-menu+.pure-g a[href*="type="]) .pure-u-md-1-4 .flex-right .video-data,
body:has(#contents>.feed-menu+.pure-g a[href*="type="]) .pure-u-md-1-4 .flex-left .video-data::before{display:none!important}
/* "1.2M views • 3 days ago" on one line, views first; live cards drop the "0 views" */
.pure-u-md-1-4 .video-card-row.flexible:has(.video-data){flex-wrap:nowrap;justify-content:flex-start;gap:0}
.pure-u-md-1-4 .video-card-row.flexible:has(.video-data)>.flex-left{flex:0 1 auto;order:2}
.pure-u-md-1-4 .video-card-row.flexible:has(.video-data)>.flex-right{order:1;flex:0 0 auto}
.pure-u-md-1-4 .video-card-row.flexible:has(.flex-right .video-data) .flex-left .video-data::before{content:"\2022";margin:0 6px}
.pure-u-md-1-4 .h-box:has(.length .ion-ios-play-circle) .flex-right:has(.video-data){display:none}
.pure-u-md-1-4 .h-box:has(.length .ion-ios-play-circle) .flex-left .video-data::before{display:none}
.pure-u-md-1-4 .h-box:not(:has(.video-data))>.video-card-row:last-child{padding-bottom:2px}
.icon-buttons{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.icon-buttons a{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--ivx-mu)!important;font-size:16px}
.icon-buttons a:hover{background:var(--ivx-s2);color:var(--ivx-tx)!important}
.pure-u-md-1-4 .h-box:hover .icon-buttons{opacity:1}
@media (hover:none){.icon-buttons{display:none!important}}
/* channel results (round avatar) + hashtag/playlist cards */
.pure-u-md-1-4 .h-box>a>center{padding:8px 0}
.pure-u-md-1-4 .h-box>a>center>img{width:136px!important;height:136px;border-radius:50%;object-fit:cover}
.pure-u-md-1-4 .h-box:has(>a>center)>*{text-align:center}
.pure-u-md-1-4 .h-box:has(>a>center) .video-card-row.flexible{justify-content:center}
.pure-u-md-1-4 .h-box:has(>a>center) .flex-left{flex:1 1 auto;text-align:center}
.pure-u-md-1-4 .h-box:has(>a>center) .channel-name{color:var(--ivx-tx)!important;font-size:16px;font-weight:600}
.pure-u-md-1-4 .h-box:has(>a>center)>p{margin:2px 0;font-size:13px;color:var(--ivx-mu)}
.pure-u-md-1-4 .h-box:has(>a>center)>h5{font-weight:400;font-size:12.5px;color:var(--ivx-dim);margin:6px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* pagination (top copy is redundant — keep the one under the grid) */
.h-box:has(>.page-nav-container):has(+.pure-g){display:none}
.page-nav-container{display:flex;justify-content:space-between;padding:8px 0 16px}
.page-nav-container .pure-button{display:inline-flex;align-items:center;gap:8px}

/* ---------- search ---------- */
#filters{margin:20px 0 0}
#filters-collapse>summary{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:9px;
  background:var(--ivx-s2);font-size:14px;font-weight:500;cursor:pointer;list-style:none}
#filters-collapse>summary::-webkit-details-marker{display:none}
#filters-collapse>summary::before,#filters-collapse>summary::after{content:none!important;display:none!important}
#filters-collapse[open]>summary{background:var(--ivx-s3)}
#filters-box{margin-top:12px;padding:16px 20px;background:var(--ivx-s1);border:1px solid var(--ivx-line);border-radius:14px}
#filters-box legend .filter-name{border:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ivx-mu);margin-bottom:8px}
#filters-box label{font-size:14px;margin-left:6px}
#filters-box input{accent-color:var(--ivx-ac)}
#filters+hr{display:none}
.no-results-error{padding:48px 0!important;color:var(--ivx-mu);text-align:center}

/* ---------- channel page ---------- */
#contents>.h-box>img[src*="/ggpht"]{display:block;border-radius:16px;margin-top:16px;max-height:220px;object-fit:cover}
#contents>.h-box:has(>img[src*="/ggpht"])+.h-box:has(>hr){display:none}

/* ===================== tap feedback: every tap visible instantly =====================
   The default tap highlight is disabled (base section); these :active states replace
   it. ivx.js also keeps a tapped link dimmed until the next page arrives (first-view
   TTFB is 0.7-2.3 s — without this a tap looks dead) and paints a red top progress
   bar the moment a link/form is activated. */
#ivx-prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:2147483000;pointer-events:none;
  background:var(--ivx-ac);box-shadow:0 0 10px rgba(242,67,58,.8);opacity:0;display:none;
  transition:opacity .25s}
#ivx-prog.ivx-go{display:block;opacity:1;animation:ivx-crawl 8s cubic-bezier(.1,.6,.2,1) forwards}
@keyframes ivx-crawl{from{width:0}to{width:80%}}
#ivx-prog.ivx-done{display:block;width:100%;opacity:0}
a img{transition:opacity .12s ease-out}
a:active{opacity:.75}
a.ivx-tapped{opacity:.85}
a:active img,a.ivx-tapped img{opacity:.6}
#ivx-nav a.ivx-i i{transition:transform .1s ease-out}
#ivx-nav a.ivx-i:active{background:var(--ivx-s3)}
#ivx-nav a.ivx-i:active i{transform:scale(.82)}
#contents>.feed-menu+.pure-g.h-box a:active{background:var(--ivx-s3)}
.pure-button:active{filter:brightness(.7)}
.searchbar #searchbutton:active{background:var(--ivx-s3)}
.video-js .vjs-control:active{opacity:.55}
.video-js .vjs-touch-overlay .vjs-play-control:active,
.video-js .vjs-big-play-button:active{transform:scale(.9);opacity:.75}
.video-js .vjs-big-play-button:active{transform:translate(-50%,-50%) scale(.9)}

/* ===================== touch player: YouTube-app style =====================
   Scoped to .vjs-touch-enabled (phones, Fold, fullscreen landscape); desktop keeps
   the stock bar. On touch, Invidious puts CC/speed/quality in .mobile-operations-bar
   (top-right) and videojs-mobile-ui adds .vjs-touch-overlay (centre play/pause). */
.vjs-touch-enabled{--yt-red:#f00}
/* swipe gestures (ui/ivx.js): browser pans only for finger-DOWN moves (page scroll),
   finger-UP is left to JS (swipe up = fullscreen); in fullscreen JS gets everything */
.video-js.vjs-touch-enabled{touch-action:pan-up}
.video-js.vjs-touch-enabled.vjs-fullscreen{touch-action:none}
.video-js.vjs-touch-enabled .vjs-remaining-time,.video-js.vjs-touch-enabled .vjs-share-control,
.video-js.vjs-touch-enabled .vjs-volume-panel,.video-js.vjs-touch-enabled .vjs-audio-button,
.video-js.vjs-touch-enabled .vjs-control-bar .vjs-play-control,
.video-js.vjs-touch-enabled .vjs-picture-in-picture-control{display:none!important}
/* scrim over the whole picture while controls are showing */
.video-js.vjs-touch-enabled .vjs-touch-overlay{transition:background-color .2s ease}
.video-js.vjs-touch-enabled.vjs-has-started:not(.vjs-user-inactive) .vjs-touch-overlay,
.video-js.vjs-touch-enabled.vjs-has-started.vjs-paused .vjs-touch-overlay{background-color:rgba(0,0,0,.42)}
/* centre play / pause */
.video-js.vjs-touch-enabled .vjs-touch-overlay .vjs-play-control{width:68px!important;height:68px!important;border-radius:50%;
  background:rgba(0,0,0,.28)}
.video-js.vjs-touch-enabled .vjs-touch-overlay .vjs-play-control .vjs-icon-placeholder::before{background-size:62%!important}
.video-js.vjs-touch-enabled.vjs-has-started:not(.vjs-user-inactive) .vjs-touch-overlay .vjs-play-control,
.video-js.vjs-touch-enabled.vjs-has-started.vjs-paused .vjs-touch-overlay .vjs-play-control{opacity:1;pointer-events:auto}
.video-js.vjs-touch-enabled .vjs-big-play-button{width:68px!important;height:68px!important;margin:0!important;border:0!important;
  border-radius:50%!important;background:rgba(0,0,0,.45)!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%);
  font-size:42px!important;line-height:68px!important}
.video-js.vjs-touch-enabled .vjs-big-play-button .vjs-icon-placeholder:before{line-height:68px!important}
/* bottom bar: time left, fullscreen right, scrubber along the bottom edge */
.video-js.vjs-touch-enabled .vjs-control-bar:not(.mobile-operations-bar){height:52px!important;background:none!important;
  padding:0 calc(6px + var(--iv-r,0px)) 12px calc(14px + var(--iv-l,0px))!important;box-sizing:border-box;align-items:center;
